<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirección General – Práctica</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#5b6478; --border:#dfe4ee;
    --primary:#3b5bdb; --primary-soft:#e7ecff;
    --ok:#1f9d55; --ok-bg:#e6f6ec; --bad:#d64545; --bad-bg:#fdeaea;
    --shadow:0 2px 10px rgba(20,30,60,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#10141f; --card:#1a2030; --text:#e8ecf5; --muted:#9aa4bb; --border:#2b3350;
      --primary:#7b93ff; --primary-soft:#232b4a;
      --ok:#4cc38a; --ok-bg:#15301f; --bad:#ff7b7b; --bad-bg:#3a1c1f;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  header{padding:28px 16px 8px;text-align:center}
  header h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem)}
  header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  main{max-width:820px;margin:0 auto;padding:0 16px 48px}

  nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:thin}
  nav button{flex:0 0 auto;border:1px solid var(--border);background:var(--card);color:var(--text);
    padding:10px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
  nav button:hover{border-color:var(--primary)}
  nav button.active{background:var(--primary);border-color:var(--primary);color:#fff}

  .unit-head{margin:0 0 14px}
  .unit-head h2{margin:0;font-size:1.15rem}
  .unit-head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .score{font-weight:600;color:var(--muted)}
  .score b{color:var(--text)}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;
    border-radius:8px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .bar{height:6px;background:var(--border);border-radius:9px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}

  .q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .q h3{margin:0 0 4px;font-size:1.02rem}
  .tag{display:inline-block;font-size:.72rem;background:var(--primary-soft);color:var(--primary);
    padding:2px 9px;border-radius:999px;margin-bottom:8px;font-weight:600}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{display:flex;gap:12px;text-align:left;width:100%;border:2px solid var(--border);background:transparent;
    color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .l{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .l{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .l{background:var(--bad);color:#fff}
  .opt.dim{opacity:.6}
  .just{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--ok);background:var(--ok-bg);font-size:.95rem}
  .just.bad{border-color:var(--bad);background:var(--bad-bg)}
  .just strong{display:block;margin-bottom:2px}
  .result{display:none;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .result.show{display:block}
  .result h2{margin:0 0 6px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .sep{flex:0 0 auto;align-self:center;width:1px;height:26px;background:var(--border);margin:0 4px}
  .note{font-size:.85rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Dirección General</h1>
  <p id="subtitle">Dirección Estratégica (Guerras &amp; Navas) · Práctica multiple choice</p>
</header>
<main>
  <nav id="tabs"></nav>
  <div class="unit-head" id="head"></div>
  <div class="toolbar">
    <div class="score">Respondidas <b id="answered">0</b>/<b id="total">0</b> · Correctas <b id="right">0</b></div>
    <div class="actions"><button class="btn" id="reset">Reiniciar</button></div>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div id="list"><div class="empty">Cargando preguntas…</div></div>
  <div class="result" id="result"></div>
</main>

<script>
/* Las preguntas se leen de preguntas_direccion_general.json (misma carpeta).
   Para agregar o corregir preguntas alcanza con editar ese archivo. */
const DATA_URL = "preguntas_direccion_general.json";
const $ = id => document.getElementById(id);
const LETTERS = "abcd";
const INTEG = "integradora";
let BLOQUES = [];
let PARCIALES = [];     // parciales anteriores: pestañas con id "p:<id>"
let current = null;
let state = {};   // estado por pestaña: { items:[...], answers:{key:opcion} }

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function itemsFor(tab){
  const tag = b => q => ({...q, bloque:b, key:q.id});
  if (tab === INTEG) return shuffle(BLOQUES.flatMap(b => b.preguntas.map(tag(b))));
  if (tab.startsWith("p:")) return parcialOf(tab).preguntas.map(q => ({...q, key:q.id}));
  const b = BLOQUES.find(b => String(b.id) === tab);
  return b.preguntas.map(tag(b));
}
function parcialOf(tab){ return PARCIALES.find(p => "p:"+p.id === tab); }
function ensure(tab){ if(!state[tab]) state[tab] = { items:itemsFor(tab), answers:{} }; return state[tab]; }

function renderTabs(){
  $("tabs").innerHTML = "";
  const tabs = [...BLOQUES.map(b=>[String(b.id),"Bloque "+b.id]), [INTEG,"🔀 Prueba Integradora"]];
  if (PARCIALES.length) tabs.push(null, ...PARCIALES.map(p=>["p:"+p.id,(p.tipo==="simulacro"?"🧩 ":"📝 ")+p.titulo]));
  tabs.forEach(t=>{
    if (!t){ const s = document.createElement("span"); s.className = "sep"; $("tabs").appendChild(s); return; }
    const [id,name] = t;
    const b = document.createElement("button");
    b.textContent = name;
    b.className = id===current ? "active" : "";
    b.onclick = () => { current = id; renderTabs(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    $("tabs").appendChild(b);
  });
  const act = $("tabs").querySelector(".active");
  if (act) act.scrollIntoView({block:"nearest",inline:"center"});
}

function renderHead(){
  if (current === INTEG){
    $("head").innerHTML = `<h2>Prueba Integradora</h2><p>Todas las preguntas de todos los bloques, en orden aleatorio.</p>`;
    return;
  }
  if (current.startsWith("p:")){
    const p = parcialOf(current);
    $("head").innerHTML = `<h2>${p.tipo==="simulacro" ? "Simulacro" : "Parcial anterior"}: ${esc(p.titulo)}</h2><p>${esc(p.nota || "")}</p>`;
    return;
  }
  const b = BLOQUES.find(b => String(b.id) === current);
  $("head").innerHTML = `<h2>${esc(b.tema)}</h2><p>${esc(b.capitulos || "")}</p>`;
}

function render(){
  renderHead();
  const s = ensure(current), list = $("list"), items = s.items, n = items.length;
  list.innerHTML = "";
  $("result").className = "result";
  items.forEach((it, i) => {
    const card = document.createElement("section");
    card.className = "q";
    const tag = current===INTEG
      ? `Bloque ${it.bloque.id} · Pregunta ${i+1} de ${n}`
      : `Pregunta ${i+1} de ${n}`;
    card.innerHTML = `<span class="tag">${tag}</span><h3>${i+1}. ${esc(it.pregunta)}</h3><div class="opts"></div>`;
    const box = card.querySelector(".opts");
    it.opciones.forEach((txt, k) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = `<span class="l">${LETTERS[k]}</span><span>${esc(txt)}</span>`;
      b.onclick = () => answer(i, k);
      box.appendChild(b);
    });
    list.appendChild(card);
    if (s.answers[it.key] !== undefined) paint(card, it, s.answers[it.key]);
  });
  updateStats();
}

function paint(card, it, choice){
  card.querySelectorAll(".opt").forEach((b,k)=>{
    b.disabled = true;
    if (k === it.correcta) b.classList.add("correct");
    else if (k === choice) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ok = choice === it.correcta;
  if (!card.querySelector(".just")){
    const d = document.createElement("div");
    d.className = "just" + (ok ? "" : " bad");
    d.innerHTML = `<strong>${ok ? "✅ ¡Correcto!" : "❌ Incorrecto — la respuesta correcta es la "+LETTERS[it.correcta]+")"}</strong>${esc(it.justificacion)}`;
    /* en los parciales, avisar cuando la respuesta marcada en la hoja original estaba mal */
    if (it.marcada_en_hoja !== undefined && it.marcada_en_hoja !== it.correcta)
      d.innerHTML += `<div class="note">📌 En la hoja del parcial estaba marcada la ${LETTERS[it.marcada_en_hoja]}), que es incorrecta.</div>`;
    card.appendChild(d);
  }
}

function answer(i, k){
  const s = ensure(current), it = s.items[i];
  if (s.answers[it.key] !== undefined) return;
  s.answers[it.key] = k;
  paint($("list").querySelectorAll(".q")[i], it, k);
  updateStats();
}

function updateStats(){
  const s = ensure(current), total = s.items.length;
  let done = 0, right = 0;
  s.items.forEach(it => {
    const a = s.answers[it.key];
    if (a !== undefined){ done++; if (a === it.correcta) right++; }
  });
  $("total").textContent = total; $("answered").textContent = done; $("right").textContent = right;
  $("progress").style.width = total ? (done/total*100)+"%" : "0";
  const r = $("result");
  if (total && done === total){
    const pct = Math.round(right/total*100);
    r.innerHTML = `<h2>${pct >= 60 ? "🎉" : "💪"} Resultado: ${right}/${total} (${pct}%)</h2><p>${pct>=60 ? "¡Buen trabajo!" : "Repasá las justificaciones e intentá de nuevo."}</p>`;
    r.className = "result show";
  } else r.className = "result";
}

$("reset").onclick = () => { delete state[current]; render(); window.scrollTo({top:0,behavior:"smooth"}); };

fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    BLOQUES = d.bloques;
    PARCIALES = d.parciales || [];
    current = String(BLOQUES[0].id);
    renderTabs(); render();
  })
  .catch(() => {
    $("list").innerHTML = '<div class="empty">No se pudieron cargar las preguntas. Si abriste el archivo directo desde la PC, usá el link de Netlify.</div>';
  });
</script>
</body>
</html>
